org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The library declares the stdlib of its API version, not the compiler's newer one.
kotlin.stdlib.default.dependency=false

# The coordinates and POM of the publication (com.vanniktech.maven.publish reads these names).
# The release workflow refuses a tag other than v<VERSION_NAME>.
GROUP=io.github.marketkernel
VERSION_NAME=0.1.0

POM_NAME=ua-cryptography-android
POM_DESCRIPTION=Ukrainian e-signatures for Android: sign and verify CAdES, XAdES and ASiC with DSTU 4145 keys from JKS key stores, and DSTU 7564 (Kupyna) hashing, over the native library of ua-cryptography-rust.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/ua-cryptography/ua-cryptography-java

POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/ua-cryptography/ua-cryptography-java
POM_SCM_CONNECTION=scm:git:https://github.com/ua-cryptography/ua-cryptography-java.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ua-cryptography/ua-cryptography-java.git

POM_DEVELOPER_ID=MarketKernel
POM_DEVELOPER_NAME=Dmitry Kukushkin
POM_DEVELOPER_URL=https://github.com/MarketKernel
