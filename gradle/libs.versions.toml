[versions]
android-gradle-plugin = "9.4.1"
# The oldest Kotlin an app may compile with is the language and API version of the library, 2.1 (a compiler reads
# metadata one version ahead, so Kotlin 2.0 apps too); the stdlib and coroutines are the newest of that line.
kotlin-stdlib = "2.1.21"
kotlinx-coroutines = "1.10.2"
maven-publish = "0.37.0"
junit = "4.13.2"
json = "20260814"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-stdlib" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
