[versions]
android-gradle-plugin = "9.4.1"
# The oldest Kotlin an app may compile with is the language and API version of the library, 2.1 (a compiler reads
# metadata one version ahead, so Kotlin 2.0 apps too); the stdlib and coroutines are the newest of that line.
kotlin-stdlib = "2.1.21"
kotlinx-coroutines = "1.10.2"
maven-publish = "0.37.0"
junit = "4.13.2"
json = "20260814"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
# Compose ui-test brings 3.5, which fails on Android 15 and later (InputManager.getInstance is gone).
espresso = "3.7.0"
# The example app only. The library as an app gets it from Maven Central: the newest published release.
ua-cryptography-android = "0.1.0"
# Its compiler plugin is the Kotlin AGP compiles with.
kotlin-compose = "2.2.10"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
core-ktx = "1.19.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-stdlib" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
ua-cryptography-android = { module = "io.github.marketkernel:ua-cryptography-android", version.ref = "ua-cryptography-android" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

[plugins]
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-compose" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
