name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The release libraries are downloaded from the pinned release and checked against the pinned SHA-256; lint, the JVM
  # tests and the publication to a local repository, as Maven Central would receive it; the example app with the
  # published library, and with this repository's, so that a change of the API that breaks it shows before a release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :ua-cryptography:build :ua-cryptography:publishToMavenLocal :example:build

      - run: ./gradlew :example:assembleRelease -PuaCryptography.exampleFromSource=true

  # The instrumented tests on an emulator: the JNI bindings, the native library, every signature format; the example
  # with the published library.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the x86_64 emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew :ua-cryptography:connectedDebugAndroidTest :example:connectedDebugAndroidTest
